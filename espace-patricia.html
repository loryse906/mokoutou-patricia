<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Espace Patricia | Gestion des photos</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="47.jpeg" />
    <style>
      .ph-row {
        display: flex;
        gap: 14px;
        align-items: center;
        padding: 10px;
        border: 1px solid var(--bd);
        border-radius: 14px;
        margin-bottom: 10px;
      }
      .ph-row img {
        width: 64px;
        height: 64px;
        object-fit: cover;
        border-radius: 10px;
      }
      .ph-row div {
        flex: 1;
      }
      .ph-row small {
        color: var(--mut);
      }
      .ph-row button {
        background: none;
        border: 1px solid #e74c3c;
        color: #e74c3c;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
      }
      .ph-row button:hover {
        background: #e74c3c;
        color: #fff;
      }
      .form label {
        display: block;
        margin-top: 16px;
        font-size: 0.8rem;
        color: var(--mut);
      }
      #msg {
        text-align: center;
        margin-top: 14px;
        min-height: 1.4em;
      }
    </style>
  </head>
  <body>
    <main class="wrap" style="max-width: 760px; padding-top: 50px; padding-bottom: 80px">
      <h1 class="stitle">Espace Patricia</h1>
      <p class="ssub">Ajoutez ou supprimez les photos du site.</p>

      <form id="login" class="form">
        <h2>Connexion</h2>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" />
        <label for="pwd">Mot de passe</label>
        <input id="pwd" type="password" required autocomplete="current-password" />
        <button class="btn main" type="submit">Se connecter</button>
      </form>

      <div id="panel" hidden>
        <form id="up" class="form">
          <h2>Ajouter une photo</h2>
          <label for="cat">Catégorie</label>
          <select id="cat"></select>
          <label for="title">Nom de la coiffure</label>
          <input id="title" placeholder="Ex : Knotless Braids longues" required maxlength="60" />
          <label for="file">Photo</label>
          <input id="file" type="file" accept="image/*" required />
          <button class="btn main" type="submit">Publier sur le site</button>
        </form>
        <h2 class="stitle" style="font-size: 1.6rem; margin: 40px 0 20px">Photos en ligne</h2>
        <div id="list"></div>
        <button id="out" class="btn line" style="margin-top: 20px">Se déconnecter</button>
      </div>
      <p id="msg" role="status"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <script src="config.js"></script>
    <script>
      const $ = (s) => document.querySelector(s);
      const msg = (t, err) => {
        $("#msg").textContent = t;
        $("#msg").style.color = err ? "#e74c3c" : "var(--g2)";
      };
      if (!CONFIG.supabaseUrl || !CONFIG.supabaseKey) {
        $("#login").innerHTML = "<p>Renseignez supabaseUrl et supabaseKey dans config.js.</p>";
        throw new Error("Supabase non configuré");
      }
      const db = supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
      const catName = (id) => (CATS.find((c) => c.id === id) || {}).name || id;
      $("#cat").innerHTML = CATS.map((c) => `<option value="${c.id}">${c.name}</option>`).join("");

      function show(on) {
        $("#login").hidden = on;
        $("#panel").hidden = !on;
        if (on) refresh();
      }
      db.auth.getSession().then(({ data }) => show(!!data.session));

      function loginError(e) {
        const m = e.message || "";
        if (m.includes("Invalid login credentials")) return "Email ou mot de passe incorrect, ou compte inexistant.";
        if (m.includes("Email not confirmed")) return "Compte non confirmé : dans Supabase, ouvrez Authentication > Users, puis confirmez l'utilisateur.";
        return "Erreur : " + m + " (vérifiez supabaseUrl et supabaseKey dans config.js)";
      }

      $("#login").onsubmit = async (e) => {
        e.preventDefault();
        const { error } = await db.auth.signInWithPassword({
          email: $("#email").value,
          password: $("#pwd").value,
        });
        error ? msg(loginError(error), true) : (msg(""), show(true));
      };
      $("#out").onclick = async () => {
        await db.auth.signOut();
        show(false);
      };

      async function refresh() {
        const { data, error } = await db
          .from("photos")
          .select("*")
          .order("created_at", { ascending: false });
        if (error) return msg("Impossible de charger les photos : " + error.message, true);
        $("#list").innerHTML = data.length
          ? ""
          : "<p style='color:var(--mut)'>Aucune photo en ligne. Le site affiche les photos locales (1.jpeg, 2.jpeg...).</p>";
        data.forEach((p) => {
          const row = document.createElement("div");
          row.className = "ph-row";
          row.innerHTML = `<img src="${p.url}" alt=""><div><b></b><br><small></small></div><button>Supprimer</button>`;
          row.querySelector("b").textContent = p.title;
          row.querySelector("small").textContent = catName(p.category);
          row.querySelector("button").onclick = async () => {
            if (!confirm(`Supprimer « ${p.title} » ?`)) return;
            await db.storage.from("photos").remove([p.path]);
            const { error } = await db.from("photos").delete().eq("id", p.id);
            error ? msg(error.message, true) : (msg("Photo supprimée."), refresh());
          };
          $("#list").appendChild(row);
        });
      }

      /* Réduit la photo (1600 px max) pour un envoi rapide, même avec peu de réseau */
      async function shrink(file) {
        const img = await createImageBitmap(file);
        const k = Math.min(1, 1600 / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * k);
        cv.height = Math.round(img.height * k);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        return new Promise((ok) => cv.toBlob(ok, "image/jpeg", 0.85));
      }

      $("#up").onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.submitter;
        btn.disabled = true;
        msg("Envoi en cours...");
        try {
          const blob = await shrink($("#file").files[0]);
          const path = `${$("#cat").value}/${Date.now()}.jpg`;
          const up = await db.storage
            .from("photos")
            .upload(path, blob, { contentType: "image/jpeg" });
          if (up.error) throw up.error;
          const url = db.storage.from("photos").getPublicUrl(path).data.publicUrl;
          const ins = await db
            .from("photos")
            .insert({ category: $("#cat").value, title: $("#title").value.trim(), url, path });
          if (ins.error) throw ins.error;
          $("#up").reset();
          msg("Photo publiée ! Elle apparaît sur le site.");
          refresh();
        } catch (err) {
          msg("Échec : " + err.message, true);
        }
        btn.disabled = false;
      };
    </script>
  </body>
</html>
